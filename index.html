<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1><i class="fa-solid fa-list-check"></i> To-Do List</h1>
            <p>Stay organized and complete your daily tasks.</p>
        </header>

        <!-- Input Section -->
        <section class="input-section">

            <input
                id="i"
                type="text"
                placeholder="Enter a new task..."
            >

            <button id="add">
                <i class="fa-solid fa-plus"></i>
                Add Task
            </button>

        </section>

        <!-- Task List -->
        <section id="lists" class="task-list">

        </section>

    </main>

    <script>
        const i = document.getElementById("i");
        const add = document.getElementById("add");
        const lists = document.getElementById("lists");

        add.addEventListener("click", () => {

            if (i.value.trim() === "") {
                alert("Please enter a task!");
                return;
            }

            const p = document.createElement("p");
            p.classList.add("task");

            const span = document.createElement("span");
            span.textContent = i.value;

            span.addEventListener("click", () => {
                if (span.style.textDecoration === "line-through") {
                    span.style.textDecoration = "none";
                } else {
                    span.style.textDecoration = "line-through";
                }
            });

            const b = document.createElement("button");
            b.innerHTML = '<i class="fa-solid fa-trash"></i>';
            b.classList.add("delete-btn");

            b.addEventListener("click", () => {
                p.remove();
            });

            p.appendChild(span);
            p.appendChild(b);

            lists.appendChild(p);

            i.value = "";
            i.focus();
        });
    </script>

</body>
</html>
